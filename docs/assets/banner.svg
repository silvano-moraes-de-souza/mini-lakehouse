  <text x="96" y="212" class="sans" font-size="20" fill="#9aa7b2">Bronze, silver and gold on Parquet and DuckDB, with late data,</text><text x="96" y="238" class="sans" font-size="20" fill="#9aa7b2">partition pruning and compaction measured</text>
