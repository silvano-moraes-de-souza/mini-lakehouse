unt="indefinite"/></rect><rect x="0" y="262" width="16" height="20" rx="3" fill="#cd7f32"><animate attributeName="x" values="1240;1060" dur="2.5s" begin="1.5s" repeatCount="indefinite"/></rect><rect x="0" y="262" width="16" height="20" rx="3" fill="#cd7f32"><animate attributeName="x" values="1240;1060" dur="2.5s" begin="2.0s" repeatCount="indefinite"/></rect></g><circle cx="1150" r="4" fill="#c0c7d0"><animate attributeName="cy" values="236;212" dur="1.2s" begin="0.0s" repeatCount="indefinite"/></circle><circle cx="1190" r="4" fill="#e9c46a"><animate attributeName="cy" values="146;122" dur="1.2s" begin="0.8s" repeatCount="indefinite"/></circle></g>
