[project]
name = "mini-lakehouse"
version = "0.1.0"
description = "Bronze, silver and gold on Parquet and DuckDB, with late data, partition pruning and compaction measured"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Silvano Moraes de Souza" }]
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "pyarrow>=16",
    "shopflow-datagen",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "psutil>=6.0",
    "matplotlib>=3.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mini_lakehouse"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PL"]
ignore = ["PLR0913", "PLR2004"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --cov=mini_lakehouse --cov-report=term-missing"

[tool.uv.sources]
shopflow-datagen = { git = "https://github.com/silvano-moraes-de-souza/shopflow-datagen" }

[project.scripts]
lakehouse = "mini_lakehouse.cli:main"

[tool.ruff.lint.per-file-ignores]
# Long lines here are SQL strings; wrapping them hurts more than it helps.
"bench/run.py" = ["E501"]
"tests/*" = ["E501"]
"src/mini_lakehouse/cli.py" = ["E501"]
"src/mini_lakehouse/landing.py" = ["E501"]
